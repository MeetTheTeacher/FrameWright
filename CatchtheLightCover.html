document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ace {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"b19bc71f-aa25-4b48-8d0c-81e143bbedcb\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"bc9ccc19-30b1-4eeb-965c-94e8de1cea23\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"b19bc71f-aa25-4b48-8d0c-81e143bbedcb\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"bc9ccc19-30b1-4eeb-965c-94e8de1cea23\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"b19bc71f-aa25-4b48-8d0c-81e143bbedcb\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"bc9ccc19-30b1-4eeb-965c-94e8de1cea23\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nhtml,body{margin:0;background:#111;}\nbody{font-family:'Outfit',Helvetica,sans-serif;color:#111;-webkit-font-smoothing:antialiased;}\na{color:#111;text-decoration:underline;}\na:hover{color:#6b5200;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<x-import component-from-global-scope=\"deck-stage\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n<section data-label=\"Catch the light\" style=\"background:#FFC83D;color:#111;overflow:hidden;font-family:'Outfit',Helvetica,sans-serif;\">\n  <div data-step=\"0\" data-anim=\"scale\" data-dur=\"1400\" style=\"position:absolute;left:470px;top:60px;width:420px;height:420px;border-radius:50%;background:#FFE08A;\"><\u002Fdiv>\n  <div data-step=\"0\" data-anim=\"scale\" data-dur=\"1600\" data-delay=\"200\" style=\"position:absolute;left:470px;top:60px;width:420px;height:420px;border-radius:50%;background-image:radial-gradient(circle, rgba(17,17,17,.6) 2.4px, transparent 3px);background-size:14px 14px;mask-image:radial-gradient(circle closest-side, #000 0%, rgba(0,0,0,.5) 45%, transparent 100%);-webkit-mask-image:radial-gradient(circle closest-side, #000 0%, rgba(0,0,0,.5) 45%, transparent 100%);\"><\u002Fdiv>\n  <p data-step=\"0\" data-anim=\"fade\" data-delay=\"900\" style=\"position:absolute;right:120px;top:110px;width:560px;margin:0;font-size:30px;line-height:1.35;font-weight:500;text-wrap:pretty;\">Tuesday 6 October. In the classroom. Camera, exposure, white balance and three-point lighting, worked out on the desk with phone torches. Tomorrow it's the real studio.<\u002Fp>\n  <div style=\"position:absolute;left:120px;bottom:130px;display:flex;flex-direction:column;\">\n    <div data-step=\"0\" data-anim=\"up\" data-delay=\"300\" style=\"font-size:210px;line-height:.92;font-weight:900;letter-spacing:-4px;\">CATCH<\u002Fdiv>\n    <div data-step=\"0\" data-anim=\"up\" data-delay=\"500\" style=\"font-size:210px;line-height:.92;font-weight:900;letter-spacing:-4px;\">THE LIGHT.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Week map\" style=\"background:#fff;color:#111;overflow:hidden;padding:110px 120px;box-sizing:border-box;display:flex;flex-direction:column;gap:70px;font-family:'Outfit',Helvetica,sans-serif;\">\n  <h2 data-step=\"0\" style=\"margin:0;font-size:64px;font-weight:800;letter-spacing:-1px;\">Week 5 is the shoot. Next week you use it.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px;flex:1;\">\n    <div data-step=\"1\" style=\"background:#F0F0F0;padding:40px 34px;display:flex;flex-direction:column;gap:22px;\">\n      <div style=\"font-size:44px;font-weight:800;\">W1-2<\u002Fdiv>\n      <div style=\"font-size:30px;font-weight:600;\">Layout + type<\u002Fdiv>\n      <div style=\"font-size:26px;line-height:1.4;margin-top:40px;\">Focal point, hierarchy, grids. Choosing type, setting it.<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-step=\"2\" style=\"background:#F0F0F0;padding:40px 34px;display:flex;flex-direction:column;gap:22px;\">\n      <div style=\"font-size:44px;font-weight:800;\">W3<\u002Fdiv>\n      <div style=\"font-size:30px;font-weight:600;\">Colour + images<\u002Fdiv>\n      <div style=\"font-size:26px;line-height:1.4;margin-top:40px;\">Palettes, licences, the asset log, the social set.<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-step=\"3\" style=\"background:#F0F0F0;padding:40px 34px;display:flex;flex-direction:column;gap:22px;\">\n      <div style=\"font-size:44px;font-weight:800;\">W4<\u002Fdiv>\n      <div style=\"font-size:30px;font-weight:600;\">Files + formats<\u002Fdiv>\n      <div style=\"font-size:26px;line-height:1.4;margin-top:40px;\">Right file, right size, right colour. Shoot planning.<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-step=\"4\" data-anim=\"pop\" style=\"background:#FFC83D;padding:40px 34px;display:flex;flex-direction:column;gap:22px;\">\n      <div style=\"font-size:44px;font-weight:800;\">W5<\u002Fdiv>\n      <div style=\"font-size:30px;font-weight:600;\">Studio<\u002Fdiv>\n      <div style=\"font-size:26px;line-height:1.4;margin-top:40px;display:flex;flex-direction:column;gap:18px;\">\n        <span>Tue: learn about light<\u002Fspan><span>Wed: shoot it.<\u002Fspan><span>Thu: hero shot, then back it up<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-step=\"5\" style=\"background:#111;color:#fff;padding:40px 34px;display:flex;flex-direction:column;gap:22px;\">\n      <div style=\"font-size:44px;font-weight:800;color:#FFC83D;\">W6<\u002Fdiv>\n      <div style=\"font-size:30px;font-weight:600;\">Use it<\u002Fdiv>\n      <div style=\"font-size:26px;line-height:1.4;margin-top:40px;display:flex;flex-direction:column;gap:18px;\">\n        <span>Tue: retouch.<\u002Fspan><span>Wed: web graphics.<\u002Fspan><span>Thu 15 Oct: Assessment 1.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The camera sees light\" style=\"background:#111;color:#fff;overflow:hidden;padding:0 160px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:60px;font-family:'Outfit',Helvetica,sans-serif;\">\n  <div data-step=\"0\" data-anim=\"scale\" data-dur=\"2000\" style=\"position:absolute;right:-220px;top:-220px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle, rgba(255,200,61,.45) 0%, rgba(255,200,61,.12) 40%, transparent 70%);\"><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:20px;position:relative;\">\n    <div data-step=\"0\" data-anim=\"up\" style=\"font-size:104px;line-height:1;font-weight:900;letter-spacing:-2px;\">A CAMERA NEVER SEES<br>YOUR SUBJECT.<\u002Fdiv>\n    <div data-step=\"1\" data-anim=\"up\" style=\"font-size:104px;line-height:1;font-weight:900;letter-spacing:-2px;color:#FFC83D;\">IT ONLY SEES THE LIGHT<br>BOUNCING OFF IT.<\u002Fdiv>\n  <\u002Fdiv>\n  <p data-step=\"2\" data-anim=\"fade\" style=\"margin:0;max-width:1100px;font-size:36px;line-height:1.4;font-weight:500;color:#e8e8e8;text-wrap:pretty;position:relative;\">Every decision this week is a decision about light. Get the light right and most of the photo is done before anyone presses the button.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"Studio safety\" style=\"background:#fff;color:#111;overflow:hidden;padding:100px 120px;box-sizing:border-box;display:flex;flex-direction:column;gap:46px;font-family:'Outfit',Helvetica,sans-serif;\">\n  <div data-step=\"0\" data-anim=\"scale\" data-dur=\"1400\" style=\"position:absolute;right:-150px;top:-150px;width:440px;height:440px;border-radius:50%;background:#FFF3CC;\"><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:36px;position:relative;\">\n    <h2 data-step=\"0\" style=\"margin:0;font-size:60px;font-weight:800;letter-spacing:-1px;\">Last Thursday you found eight hazards on paper.<\u002Fh2>\n    <h2 data-step=\"0\" data-delay=\"250\" style=\"margin:0;font-size:60px;font-weight:800;letter-spacing:-1px;\">Tomorrow you walk into the room.<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;flex:1;\">\n    <div data-step=\"1\" style=\"background:#F0F0F0;padding:34px;display:flex;flex-direction:column;gap:14px;\"><div style=\"font-size:32px;font-weight:700;\">Cables<\u002Fdiv><div style=\"font-size:26px;line-height:1.38;\">Round the edges of the room. Taped or matted where they cross. Nothing across the doorway, ever.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"2\" style=\"background:#F0F0F0;padding:34px;display:flex;flex-direction:column;gap:14px;\"><div style=\"font-size:32px;font-weight:700;\">Stands<\u002Fdiv><div style=\"font-size:26px;line-height:1.38;\">Legs fully out. Sandbag on anything tall, and always on a boom. Top-heavy kit falls on people.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"3\" style=\"background:#F0F0F0;padding:34px;display:flex;flex-direction:column;gap:14px;\"><div style=\"font-size:32px;font-weight:700;\">Hot lights<\u002Fdiv><div style=\"font-size:26px;line-height:1.38;\">Modelling lamps burn skin and scorch backdrop paper. Keep them off the paper, let them cool before packing.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"4\" style=\"background:#F0F0F0;padding:34px;display:flex;flex-direction:column;gap:14px;\"><div style=\"font-size:32px;font-weight:700;\">No food or drink<\u002Fdiv><div style=\"font-size:26px;line-height:1.38;\">Not on the trolley, not by the batteries, not on the floor. Bags and bottles stay at the door.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"5\" style=\"background:#F0F0F0;padding:34px;display:flex;flex-direction:column;gap:14px;\"><div style=\"font-size:32px;font-weight:700;\">Ask before you flash<\u002Fdiv><div style=\"font-size:26px;line-height:1.38;\">Your subject is a person. Tell them before the flash fires and check they're fine with it.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"6\" style=\"background:#F0F0F0;padding:34px;display:flex;flex-direction:column;gap:14px;\"><div style=\"font-size:32px;font-weight:700;\">Feet on the floor<\u002Fdiv><div style=\"font-size:26px;line-height:1.38;\">Nobody stands on chairs, tables or cases. Can't reach? Use the step, or ask.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-step=\"7\" data-anim=\"growx\" style=\"background:#111;color:#fff;padding:26px 34px;font-size:27px;font-weight:600;transform-origin:left center;\">Break a rule tomorrow and you're off the kit for the session, its not a punishment but it's how real studios run<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Exposure\" style=\"background:#fff;color:#111;overflow:hidden;padding:90px 120px;box-sizing:border-box;display:flex;flex-direction:column;gap:30px;font-family:'Outfit',Helvetica,sans-serif;\">\n  <div data-step=\"0\" data-anim=\"scale\" data-dur=\"1400\" style=\"position:absolute;right:-150px;top:-150px;width:440px;height:440px;border-radius:50%;background:#FFF3CC;\"><\u002Fdiv>\n  <h2 data-step=\"0\" style=\"margin:0;font-size:58px;line-height:1.12;font-weight:800;letter-spacing:-1px;position:relative;\">Exposure is just filling a bucket with light<br>Three dials decide how<\u002Fh2>\n  <div data-step=\"1\" data-anim=\"fade\" style=\"display:flex;flex-direction:column;gap:4px;font-size:28px;line-height:1.35;position:relative;\">\n    <span>Too little light and the photo is dark. Too much and it's washed out<\u002Fspan>\n    <span>You get the right amount by mixing three dials and every dial has a side effect<\u002Fspan>\n    <span style=\"font-weight:700;\">The side effect is the real choice.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;flex:1;margin-top:10px;\">\n    <div data-step=\"2\" style=\"background:#FFC83D;padding:32px 36px;display:flex;flex-direction:column;gap:14px;\">\n      <div style=\"font-size:36px;font-weight:800;\">Aperture<\u002Fdiv>\n      <div style=\"font-size:24px;font-weight:600;\">f/2.8 - f/16<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:30px;height:100px;\">\n        <div data-step=\"2\" data-anim=\"pop\" data-delay=\"250\" style=\"width:92px;height:92px;border-radius:50%;background:#111;\"><\u002Fdiv>\n        <div data-step=\"2\" data-anim=\"pop\" data-delay=\"400\" style=\"width:60px;height:60px;border-radius:50%;background:#111;\"><\u002Fdiv>\n        <div data-step=\"2\" data-anim=\"pop\" data-delay=\"550\" style=\"width:30px;height:30px;border-radius:50%;background:#111;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.38;\">How wide the hole in the lens opens<\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.38;\">Small number = big hole = more light, and the background goes soft<\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.38;\">Big number = small hole, less light, everything sharp<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-step=\"3\" style=\"background:#F0F0F0;padding:32px 36px;display:flex;flex-direction:column;gap:14px;\">\n      <div style=\"font-size:36px;font-weight:800;\">Shutter speed<\u002Fdiv>\n      <div style=\"font-size:24px;font-weight:600;\">1/250 - 1/15<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:22px;height:100px;\">\n        <div data-step=\"3\" data-anim=\"growx\" data-delay=\"250\" style=\"width:22px;height:34px;background:#111;transform-origin:left center;\"><\u002Fdiv>\n        <div data-step=\"3\" data-anim=\"growx\" data-delay=\"450\" style=\"width:70px;height:34px;background:#111;transform-origin:left center;\"><\u002Fdiv>\n        <div data-step=\"3\" data-anim=\"growx\" data-delay=\"650\" data-dur=\"1100\" style=\"width:170px;height:34px;background:#111;transform-origin:left center;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.38;\">How long the hole stays open<\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.38;\">Fast (1/250) freezes movement<\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.38;\">Slow (1/15) lets in more light, but anything that moves blurs - including your hands<\u002Fdiv>\n    <\u002Fdiv>\n    <div data-step=\"4\" style=\"background:#F0F0F0;padding:32px 36px;display:flex;flex-direction:column;gap:14px;\">\n      <div style=\"font-size:36px;font-weight:800;\">ISO<\u002Fdiv>\n      <div style=\"font-size:24px;font-weight:600;\">100 - 3200<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:24px;height:100px;\">\n        <div data-step=\"4\" data-anim=\"fade\" data-delay=\"250\" style=\"width:120px;height:90px;background-image:radial-gradient(circle, #111 2px, transparent 2.6px);background-size:30px 26px;\"><\u002Fdiv>\n        <div data-step=\"4\" data-anim=\"fade\" data-delay=\"550\" style=\"width:120px;height:90px;background-image:radial-gradient(circle, #111 2px, transparent 2.6px);background-size:11px 10px;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.38;\">How sensitive the sensor is<\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.38;\">Turn it up and the picture gets brighter, but grainy<\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.38;\">Tomorrow we have studio lights, so keep it low: 100 to 400.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Change one dial\" style=\"background:#fff;color:#111;overflow:hidden;padding:100px 120px;box-sizing:border-box;display:flex;flex-direction:column;gap:44px;font-family:'Outfit',Helvetica,sans-serif;\">\n  <div data-step=\"0\" data-anim=\"scale\" data-dur=\"1400\" style=\"position:absolute;right:-150px;top:-150px;width:440px;height:440px;border-radius:50%;background:#FFF3CC;\"><\u002Fdiv>\n  <h2 data-step=\"0\" style=\"margin:0;font-size:60px;line-height:1.12;font-weight:800;letter-spacing:-1px;position:relative;\">Change one and watch what happens<br><span style=\"font-weight:500;\">That's the whole method<\u002Fspan><\u002Fh2>\n  <div style=\"display:flex;flex-direction:column;gap:12px;flex:1;\">\n    <div data-step=\"0\" data-anim=\"fade\" data-delay=\"300\" style=\"display:grid;grid-template-columns:220px 1fr 1fr 1.4fr;gap:30px;padding:0 30px 8px;font-size:24px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:1px;\">\n      <span>Dial<\u002Fspan><span>For more light<\u002Fspan><span>What it costs you<\u002Fspan><span>Studio starting point<\u002Fspan>\n    <\u002Fdiv>\n    <div data-step=\"1\" data-anim=\"left\" style=\"display:grid;grid-template-columns:220px 1fr 1fr 1.4fr;gap:30px;padding:30px;background:#F0F0F0;font-size:26px;line-height:1.38;align-items:start;\">\n      <span style=\"font-size:32px;font-weight:800;\">Aperture<\u002Fspan><span>Lower f-number (f/4 to f/2.8)<\u002Fspan><span>Less is sharp. Background goes soft.<\u002Fspan><span>f/8 for products and detail. f/4 for a portrait with a soft background.<\u002Fspan>\n    <\u002Fdiv>\n    <div data-step=\"2\" data-anim=\"left\" style=\"display:grid;grid-template-columns:220px 1fr 1fr 1.4fr;gap:30px;padding:30px;background:#F0F0F0;font-size:26px;line-height:1.38;align-items:start;\">\n      <span style=\"font-size:32px;font-weight:800;\">Shutter<\u002Fspan><span>Slower (1/60 to 1/30)<\u002Fspan><span>Movement blur. Camera shake if handheld.<\u002Fspan><span>1/125 or faster handheld. With flash, at or under the sync speed (usually 1/160 to 1/250).<\u002Fspan>\n    <\u002Fdiv>\n    <div data-step=\"3\" data-anim=\"left\" style=\"display:grid;grid-template-columns:220px 1fr 1fr 1.4fr;gap:30px;padding:30px;background:#F0F0F0;font-size:26px;line-height:1.38;align-items:start;\">\n      <span style=\"font-size:32px;font-weight:800;\">ISO<\u002Fspan><span>Higher (800 and up)<\u002Fspan><span>Grain. Muddy shadows.<\u002Fspan><span>100 to 400. Only go higher if everything else is maxed.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-step=\"4\" data-anim=\"growx\" style=\"background:#111;color:#fff;padding:26px 34px;font-size:28px;font-weight:600;transform-origin:left center;\"><span style=\"color:#FFC83D;\">Too dark?<\u002Fspan> Move the key light closer, then open the aperture, then slow the shutter. ISO last.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"White balance\" style=\"background:#fff;color:#111;overflow:hidden;padding:100px 120px;box-sizing:border-box;display:flex;flex-direction:column;gap:60px;font-family:'Outfit',Helvetica,sans-serif;\">\n  <div data-step=\"0\" data-anim=\"scale\" data-dur=\"1400\" style=\"position:absolute;right:-150px;top:-150px;width:440px;height:440px;border-radius:50%;background:#FFF3CC;\"><\u002Fdiv>\n  <h2 data-step=\"0\" style=\"margin:0;font-size:60px;font-weight:800;letter-spacing:-1px;position:relative;\">White balance: why your photos go orange or blue<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(3,250px) minmax(0,1fr) minmax(0,1fr);gap:24px;flex:1;\">\n    <div data-step=\"1\" data-anim=\"up\" style=\"display:flex;flex-direction:column;gap:18px;\"><div style=\"height:300px;background:#E9A15A;\"><\u002Fdiv><div style=\"font-size:30px;font-weight:700;\">Too orange<\u002Fdiv><div style=\"font-size:24px;line-height:1.38;\">Camera thinks it's daylight, room is lit by warm bulbs (about 3200K).<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"1\" data-anim=\"up\" data-delay=\"150\" style=\"display:flex;flex-direction:column;gap:18px;\"><div style=\"height:300px;background:#E2DDD4;\"><\u002Fdiv><div style=\"font-size:30px;font-weight:700;\">Right<\u002Fdiv><div style=\"font-size:24px;line-height:1.38;\">Camera told what colour the light is. Whites look white.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"1\" data-anim=\"up\" data-delay=\"300\" style=\"display:flex;flex-direction:column;gap:18px;\"><div style=\"height:300px;background:#93B4DA;\"><\u002Fdiv><div style=\"font-size:30px;font-weight:700;\">Too blue<\u002Fdiv><div style=\"font-size:24px;line-height:1.38;\">Camera thinks it's warm bulbs, room is daylight or shade (5500K and up).<\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:24px;margin-left:24px;\">\n      <div data-step=\"2\" style=\"background:#F0F0F0;padding:30px;flex:1;display:flex;flex-direction:column;gap:12px;\"><div style=\"font-size:30px;font-weight:700;\">Light has a colour<\u002Fdiv><div style=\"font-size:24px;line-height:1.38;\">Bulbs are warm, daylight and LEDs are cooler. Your eye corrects it without telling you. The camera has to be told.<\u002Fdiv><\u002Fdiv>\n      <div data-step=\"4\" style=\"background:#F0F0F0;padding:30px;flex:1;display:flex;flex-direction:column;gap:12px;\"><div style=\"font-size:30px;font-weight:700;\">Safety net: RAW<\u002Fdiv><div style=\"font-size:24px;line-height:1.38;\">In RAW, white balance is a label you can change later with no damage. In JPG it's baked in for good.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:24px;\">\n      <div data-step=\"3\" style=\"background:#F0F0F0;padding:30px;flex:1;display:flex;flex-direction:column;gap:12px;\"><div style=\"font-size:30px;font-weight:700;\">The fix<\u002Fdiv><div style=\"font-size:24px;line-height:1.38;\">Set white balance to match the lights: the bulb or daylight preset, or a Kelvin number. Or shoot a grey card and set a custom one.<\u002Fdiv><\u002Fdiv>\n      <div data-step=\"5\" data-anim=\"pop\" style=\"background:#FFC83D;padding:30px;flex:1;display:flex;flex-direction:column;gap:12px;\"><div style=\"font-size:30px;font-weight:700;\">The habit<\u002Fdiv><div style=\"font-size:24px;line-height:1.38;\">First frame of every new set-up: grey card or plain white paper in the subject's hand. Ten seconds. Saves an hour.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Three-point lighting\" style=\"background:#fff;color:#111;overflow:hidden;padding:90px 120px;box-sizing:border-box;display:flex;flex-direction:column;gap:46px;font-family:'Outfit',Helvetica,sans-serif;\">\n  <div data-step=\"0\" data-anim=\"scale\" data-dur=\"1400\" style=\"position:absolute;right:-150px;top:-150px;width:440px;height:440px;border-radius:50%;background:#FFF3CC;\"><\u002Fdiv>\n  <h2 data-step=\"0\" style=\"margin:0;font-size:60px;line-height:1.12;font-weight:800;letter-spacing:-1px;position:relative;\">Three-point lighting<br><span style=\"font-weight:500;\">Three lights, three different jobs<\u002Fspan><\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:860px minmax(0,1fr);gap:40px;flex:1;\">\n    <div data-step=\"0\" data-anim=\"fade\" data-delay=\"200\" style=\"background:#F0F0F0;position:relative;overflow:hidden;\">\n      <svg data-step=\"1\" data-anim=\"fade\" width=\"860\" height=\"720\" style=\"position:absolute;left:0;top:0;\"><line x1=\"230\" y1=\"520\" x2=\"430\" y2=\"330\" stroke=\"#111\" stroke-width=\"3\" stroke-dasharray=\"8 8\"><\u002Fline><\u002Fsvg>\n      <svg data-step=\"2\" data-anim=\"fade\" width=\"860\" height=\"720\" style=\"position:absolute;left:0;top:0;\"><line x1=\"650\" y1=\"520\" x2=\"430\" y2=\"330\" stroke=\"#111\" stroke-width=\"3\" stroke-dasharray=\"8 8\"><\u002Fline><\u002Fsvg>\n      <svg data-step=\"3\" data-anim=\"fade\" width=\"860\" height=\"720\" style=\"position:absolute;left:0;top:0;\"><line x1=\"590\" y1=\"175\" x2=\"430\" y2=\"330\" stroke=\"#111\" stroke-width=\"3\" stroke-dasharray=\"8 8\"><\u002Fline><\u002Fsvg>\n      <div style=\"position:absolute;left:140px;top:56px;width:580px;display:flex;flex-direction:column;align-items:center;gap:8px;\"><div style=\"width:580px;height:22px;background:#9a9a9a;\"><\u002Fdiv><span style=\"font-size:24px;color:#444;\">backdrop<\u002Fspan><\u002Fdiv>\n      <div style=\"position:absolute;left:380px;top:280px;width:100px;display:flex;flex-direction:column;align-items:center;gap:8px;\"><div style=\"width:100px;height:100px;border-radius:50%;background:#111;\"><\u002Fdiv><span style=\"font-size:24px;color:#444;\">subject<\u002Fspan><\u002Fdiv>\n      <div style=\"position:absolute;left:370px;top:600px;width:120px;display:flex;flex-direction:column;align-items:center;gap:6px;\"><div style=\"width:120px;height:66px;background:#555;\"><\u002Fdiv><span style=\"font-size:24px;color:#444;\">camera<\u002Fspan><\u002Fdiv>\n      <div data-step=\"1\" data-anim=\"pop\" style=\"position:absolute;left:180px;top:470px;width:100px;display:flex;flex-direction:column;align-items:center;gap:8px;\"><div style=\"width:100px;height:100px;border-radius:50%;background:#FFC83D;border:3px solid #111;box-sizing:border-box;box-shadow:0 0 80px 30px rgba(255,200,61,.55);\"><\u002Fdiv><span style=\"font-size:26px;font-weight:800;\">KEY<\u002Fspan><\u002Fdiv>\n      <div data-step=\"2\" data-anim=\"pop\" style=\"position:absolute;left:600px;top:470px;width:100px;display:flex;flex-direction:column;align-items:center;gap:8px;\"><div style=\"width:100px;height:100px;border-radius:50%;background:#FFE7A3;border:3px solid #111;box-sizing:border-box;box-shadow:0 0 50px 14px rgba(255,231,163,.7);\"><\u002Fdiv><span style=\"font-size:26px;font-weight:800;\">FILL<\u002Fspan><\u002Fdiv>\n      <div data-step=\"3\" data-anim=\"pop\" style=\"position:absolute;left:545px;top:130px;width:90px;display:flex;flex-direction:column;align-items:center;gap:8px;\"><div style=\"width:90px;height:90px;border-radius:50%;background:#fff;border:3px solid #111;box-sizing:border-box;box-shadow:0 0 50px 14px rgba(255,255,255,.9);\"><\u002Fdiv><span style=\"font-size:26px;font-weight:800;\">BACK<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:24px;\">\n      <div data-step=\"1\" data-anim=\"right\" style=\"background:#FFC83D;padding:32px 36px;flex:1;display:flex;flex-direction:column;gap:12px;\"><div style=\"font-size:34px;font-weight:800;\">Key<\u002Fdiv><div style=\"font-size:25px;line-height:1.4;\">The main light, about 45 degrees to one side and a bit above. Sets the mood and decides where the shadows fall.<\u002Fdiv><\u002Fdiv>\n      <div data-step=\"2\" data-anim=\"right\" style=\"background:#F0F0F0;padding:32px 36px;flex:1;display:flex;flex-direction:column;gap:12px;\"><div style=\"font-size:34px;font-weight:800;\">Fill<\u002Fdiv><div style=\"font-size:25px;line-height:1.4;\">Softer, on the other side, or a reflector. Doesn't remove shadows - decides how dark they are.<\u002Fdiv><\u002Fdiv>\n      <div data-step=\"3\" data-anim=\"right\" style=\"background:#F0F0F0;padding:32px 36px;flex:1;display:flex;flex-direction:column;gap:12px;\"><div style=\"font-size:34px;font-weight:800;\">Back<\u002Fdiv><div style=\"font-size:25px;line-height:1.4;\">Behind the subject, aimed at head and shoulders. Draws a bright edge that lifts them off the backdrop.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"High key or low key\" style=\"background:#fff;color:#111;overflow:hidden;padding:100px 120px;box-sizing:border-box;display:flex;flex-direction:column;gap:50px;font-family:'Outfit',Helvetica,sans-serif;\">\n  <div data-step=\"0\" data-anim=\"scale\" data-dur=\"1400\" style=\"position:absolute;right:-150px;top:-150px;width:440px;height:440px;border-radius:50%;background:#FFF3CC;\"><\u002Fdiv>\n  <h2 data-step=\"0\" style=\"margin:0;font-size:60px;line-height:1.12;font-weight:800;letter-spacing:-1px;position:relative;\">High key or low key? The lighting picks the genre<br>before the poster does.<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;flex:1;\">\n    <div data-step=\"1\" data-anim=\"left\" style=\"background:#F6F3EA;padding:48px;display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:30px;\">\n      <div style=\"display:flex;flex-direction:column;gap:18px;\">\n        <div style=\"font-size:60px;font-weight:900;letter-spacing:-1px;\">HIGH KEY<\u002Fdiv>\n        <div style=\"font-size:30px;font-weight:700;\">Bright, soft, few shadows<\u002Fdiv>\n        <div style=\"font-size:25px;line-height:1.4;\">Lots of fill, often a lit backdrop. Faces open and easy to read. Feels safe, friendly, honest.<\u002Fdiv>\n        <div style=\"font-size:25px;line-height:1.4;\"><b>Reads as:<\u002Fb> Comedy, romance, family matinee, documentary.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-step=\"1\" data-anim=\"pop\" data-delay=\"300\" style=\"width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 40% 40%, #fff 0%, #F1E6C8 100%);box-shadow:0 10px 50px rgba(255,200,61,.45);\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div data-step=\"2\" data-anim=\"right\" style=\"background:#111;color:#fff;padding:48px;display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:30px;\">\n      <div style=\"display:flex;flex-direction:column;gap:18px;\">\n        <div style=\"font-size:60px;font-weight:900;letter-spacing:-1px;color:#FFC83D;\">LOW KEY<\u002Fdiv>\n        <div style=\"font-size:30px;font-weight:700;\">Dark, hard, deep shadows<\u002Fdiv>\n        <div style=\"font-size:25px;line-height:1.4;\">One strong key, little or no fill. Half the face falls away. Feels tense, private, like something is being hidden.<\u002Fdiv>\n        <div style=\"font-size:25px;line-height:1.4;\"><b>Reads as:<\u002Fb> Horror, thriller, noir, late-night screenings.<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-step=\"2\" data-anim=\"pop\" data-delay=\"300\" style=\"width:200px;height:200px;border-radius:50%;background:linear-gradient(90deg, #d8d8d8 0%, #9a9a9a 42%, #1c1c1c 52%, #111 100%);\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-step=\"3\" data-anim=\"growx\" style=\"background:#FFC83D;padding:26px 34px;font-size:28px;font-weight:600;transform-origin:left center;\">Same subject, same camera. Move one light and the poster changes genre. That's what you're about to prove.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Tabletop studio\" style=\"background:#fff;color:#111;overflow:hidden;padding:100px 120px;box-sizing:border-box;display:flex;flex-direction:column;gap:60px;font-family:'Outfit',Helvetica,sans-serif;\">\n  <div data-step=\"0\" data-anim=\"scale\" data-dur=\"1400\" style=\"position:absolute;right:-150px;top:-150px;width:440px;height:440px;border-radius:50%;background:#FFF3CC;\"><\u002Fdiv>\n  <h2 data-step=\"0\" style=\"margin:0;font-size:60px;font-weight:800;letter-spacing:-1px;position:relative;\">The tabletop studio Set Up<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;flex:1;\">\n    <div data-step=\"1\" style=\"background:#FFC83D;padding:40px 34px;display:flex;flex-direction:column;gap:30px;\"><div style=\"font-size:34px;font-weight:800;\">Lights<\u002Fdiv><div style=\"font-size:26px;line-height:1.42;\">Phone torches and desk lamps. A bare torch is a small, hard light. Shine it through tissue paper and it goes soft, like a softbox.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"2\" style=\"background:#F0F0F0;padding:40px 34px;display:flex;flex-direction:column;gap:30px;\"><div style=\"font-size:34px;font-weight:800;\">Subject<\u002Fdiv><div style=\"font-size:26px;line-height:1.42;\">A prop from the FLICKER table - popcorn box, ticket, toy figure - or a volunteer's face.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"3\" style=\"background:#F0F0F0;padding:40px 34px;display:flex;flex-direction:column;gap:30px;\"><div style=\"font-size:34px;font-weight:800;\">Reflector and flag<\u002Fdiv><div style=\"font-size:26px;line-height:1.42;\">White paper bounces light back in: that's your fill. Black card blocks light: more shadow, more drama.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"4\" style=\"background:#F0F0F0;padding:40px 34px;display:flex;flex-direction:column;gap:30px;\"><div style=\"font-size:34px;font-weight:800;\">Camera<\u002Fdiv><div style=\"font-size:26px;line-height:1.42;\">College camera if we have one out, or your phone in Pro or manual mode. Elbows on the desk to keep it still.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-step=\"5\" data-anim=\"growx\" style=\"background:#FFC83D;padding:26px 34px;font-size:28px;font-weight:600;transform-origin:left center;\">Everything you work out on the desk today works in the studio tomorrow. The lights just get bigger.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Light the genre\" style=\"background:#fff;color:#111;overflow:hidden;display:grid;grid-template-columns:620px minmax(0,1fr);font-family:'Outfit',Helvetica,sans-serif;\">\n  <div data-step=\"0\" data-anim=\"left\" style=\"background:#FFC83D;padding:110px 70px;display:flex;flex-direction:column;gap:40px;position:relative;overflow:hidden;\">\n    <div style=\"font-size:100px;line-height:.95;font-weight:900;letter-spacing:-2px;\">LIGHT THE<br>GENRE<\u002Fdiv>\n    <div style=\"font-size:28px;line-height:1.4;font-weight:500;\">Tabletop set-up, one torch as the key to start.<\u002Fdiv>\n    <div style=\"font-size:28px;line-height:1.4;font-weight:500;\">Other groups have to guess your genre.<\u002Fdiv>\n    <div data-step=\"0\" data-anim=\"scale\" data-delay=\"400\" data-dur=\"1500\" style=\"position:absolute;left:90px;bottom:-200px;width:460px;height:460px;border-radius:50%;background-image:radial-gradient(circle, rgba(17,17,17,.6) 2.4px, transparent 3px);background-size:14px 14px;mask-image:radial-gradient(circle closest-side, #000 0%, rgba(0,0,0,.5) 45%, transparent 100%);-webkit-mask-image:radial-gradient(circle closest-side, #000 0%, rgba(0,0,0,.5) 45%, transparent 100%);\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:110px 110px 90px 100px;display:flex;flex-direction:column;gap:46px;\">\n    <div data-step=\"1\" style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:32px;align-items:start;\"><div style=\"width:64px;height:64px;border-radius:50%;background:#111;color:#FFC83D;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;\">1<\u002Fdiv><div style=\"font-size:30px;line-height:1.4;padding-top:8px;\"><b>One torch only.<\u002Fb> Move it: high, low, side-on, behind. Find the position that says your genre.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"2\" style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:32px;align-items:start;\"><div style=\"width:64px;height:64px;border-radius:50%;background:#111;color:#FFC83D;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;\">2<\u002Fdiv><div style=\"font-size:30px;line-height:1.4;padding-top:8px;\"><b>Decide on fill.<\u002Fb> White paper, a second torch, or nothing. Say why before you do it.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"3\" style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:32px;align-items:start;\"><div style=\"width:64px;height:64px;border-radius:50%;background:#111;color:#FFC83D;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;\">3<\u002Fdiv><div style=\"font-size:30px;line-height:1.4;padding-top:8px;\"><b>Decide on the back light.<\u002Fb> Edge, glow, silhouette or nothing.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"4\" style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:32px;align-items:start;\"><div style=\"width:64px;height:64px;border-radius:50%;background:#111;color:#FFC83D;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;\">4<\u002Fdiv><div style=\"font-size:30px;line-height:1.4;padding-top:8px;\"><b>Gallery walk.<\u002Fb> Phones face-up on your desk. Other groups write the genre on a sticky note. Wrong guesses? Your lighting said something else - what?<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"5\" data-anim=\"growx\" style=\"margin-top:auto;background:#111;color:#fff;padding:28px 34px;font-size:27px;line-height:1.4;transform-origin:left center;\"><b style=\"color:#FFC83D;\">DONE LOOKS LIKE<\u002Fb> a frame per group that the room can name, and one sentence on which light did the most work.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"One, two, three\" style=\"background:#fff;color:#111;overflow:hidden;display:grid;grid-template-columns:620px minmax(0,1fr);font-family:'Outfit',Helvetica,sans-serif;\">\n  <div data-step=\"0\" data-anim=\"left\" style=\"background:#FFC83D;padding:110px 70px;display:flex;flex-direction:column;gap:40px;position:relative;overflow:hidden;\">\n    <div style=\"font-size:100px;line-height:.95;font-weight:900;letter-spacing:-2px;\">ONE, TWO,<br>THREE<\u002Fdiv>\n    <div style=\"font-size:28px;line-height:1.4;font-weight:500;\">In pairs, on the desk.<\u002Fdiv>\n    <div style=\"font-size:28px;line-height:1.4;font-weight:500;\">Same subject, same framing, camera kept still.<\u002Fdiv>\n    <div style=\"font-size:28px;line-height:1.4;font-weight:700;\">You're photographing what each light adds<\u002Fdiv>\n    <div data-step=\"0\" data-anim=\"scale\" data-delay=\"400\" data-dur=\"1500\" style=\"position:absolute;left:90px;bottom:-240px;width:460px;height:460px;border-radius:50%;background-image:radial-gradient(circle, rgba(17,17,17,.6) 2.4px, transparent 3px);background-size:14px 14px;mask-image:radial-gradient(circle closest-side, #000 0%, rgba(0,0,0,.5) 45%, transparent 100%);-webkit-mask-image:radial-gradient(circle closest-side, #000 0%, rgba(0,0,0,.5) 45%, transparent 100%);\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:80px 110px 70px 100px;display:flex;flex-direction:column;gap:30px;\">\n    <div data-step=\"1\" style=\"display:grid;grid-template-columns:60px minmax(0,1fr);gap:30px;align-items:start;\"><div style=\"width:60px;height:60px;border-radius:50%;background:#111;color:#FFC83D;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;\">1<\u002Fdiv><div style=\"font-size:27px;line-height:1.4;padding-top:8px;\"><b>Key only.<\u002Fb> One torch or lamp. Shoot it. Note the settings.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"2\" style=\"display:grid;grid-template-columns:60px minmax(0,1fr);gap:30px;align-items:start;\"><div style=\"width:60px;height:60px;border-radius:50%;background:#111;color:#FFC83D;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;\">2<\u002Fdiv><div style=\"font-size:27px;line-height:1.4;padding-top:8px;\"><b>Key + fill.<\u002Fb> Second torch or white paper. Shoot it. Don't move the camera.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"3\" style=\"display:grid;grid-template-columns:60px minmax(0,1fr);gap:30px;align-items:start;\"><div style=\"width:60px;height:60px;border-radius:50%;background:#111;color:#FFC83D;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;\">3<\u002Fdiv><div style=\"font-size:27px;line-height:1.4;padding-top:8px;\"><b>Key + fill + back.<\u002Fb> Third torch behind the subject. Shoot it. Now you have the set-up.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"4\" style=\"display:grid;grid-template-columns:60px minmax(0,1fr);gap:30px;align-items:start;\"><div style=\"width:60px;height:60px;border-radius:50%;background:#111;color:#FFC83D;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;\">4<\u002Fdiv><div style=\"font-size:27px;line-height:1.4;padding-top:8px;\"><b>Bracket the three-light shot.<\u002Fb> Same frame, three exposures: darker, normal, brighter. Cameras can do it automatically; on a phone, slide the exposure down and up.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"5\" style=\"display:grid;grid-template-columns:60px minmax(0,1fr);gap:30px;align-items:start;\"><div style=\"width:60px;height:60px;border-radius:50%;background:#111;color:#FFC83D;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;\">5<\u002Fdiv><div style=\"font-size:27px;line-height:1.4;padding-top:8px;\"><b>Compare them side by side.<\u002Fb> Which one suits your genre? One line: decision, reason, effect.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"6\" data-anim=\"growx\" style=\"margin-top:auto;background:#111;color:#fff;padding:26px 34px;font-size:26px;line-height:1.4;transform-origin:left center;\"><b style=\"color:#FFC83D;\">DONE LOOKS LIKE<\u002Fb> six frames in order, settings written down, and one decision-reason-effect line.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Set up for tomorrow\" style=\"background:#fff;color:#111;overflow:hidden;display:grid;grid-template-columns:620px minmax(0,1fr);font-family:'Outfit',Helvetica,sans-serif;\">\n  <div data-step=\"0\" data-anim=\"left\" style=\"background:#FFC83D;padding:110px 70px;display:flex;flex-direction:column;gap:40px;position:relative;overflow:hidden;\">\n    <div style=\"font-size:84px;line-height:.95;font-weight:900;letter-spacing:-2px;\">SET UP FOR<br>TOMORROW<\u002Fdiv>\n    <div style=\"font-size:28px;line-height:1.4;font-weight:500;\">Tomorrow starts at the button, not the menu. Set it now while you still remember how.<\u002Fdiv>\n    <div data-step=\"0\" data-anim=\"scale\" data-delay=\"400\" data-dur=\"1500\" style=\"position:absolute;left:90px;bottom:-200px;width:460px;height:460px;border-radius:50%;background-image:radial-gradient(circle, rgba(17,17,17,.6) 2.4px, transparent 3px);background-size:14px 14px;mask-image:radial-gradient(circle closest-side, #000 0%, rgba(0,0,0,.5) 45%, transparent 100%);-webkit-mask-image:radial-gradient(circle closest-side, #000 0%, rgba(0,0,0,.5) 45%, transparent 100%);\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:110px 110px 90px 100px;display:flex;flex-direction:column;gap:44px;\">\n    <div data-step=\"1\" style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:32px;align-items:start;\"><div style=\"width:64px;height:64px;border-radius:50%;background:#111;color:#FFC83D;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;\">1<\u002Fdiv><div style=\"font-size:30px;line-height:1.4;padding-top:8px;\"><b>Back up anything already on the card.<\u002Fb> Then format it - in the camera, not the computer.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"2\" style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:32px;align-items:start;\"><div style=\"width:64px;height:64px;border-radius:50%;background:#111;color:#FFC83D;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;\">2<\u002Fdiv><div style=\"font-size:30px;line-height:1.4;padding-top:8px;\"><b>Set RAW.<\u002Fb> Or RAW + JPG if the card's big enough.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"3\" style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:32px;align-items:start;\"><div style=\"width:64px;height:64px;border-radius:50%;background:#111;color:#FFC83D;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;\">3<\u002Fdiv><div style=\"font-size:30px;line-height:1.4;padding-top:8px;\"><b>Set white balance for the studio lights.<\u002Fb> I'll give you the setting. Not auto.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"4\" style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:32px;align-items:start;\"><div style=\"width:64px;height:64px;border-radius:50%;background:#111;color:#FFC83D;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;\">4<\u002Fdiv><div style=\"font-size:30px;line-height:1.4;padding-top:8px;\"><b>Batteries on charge.<\u002Fb> Two per camera. Labelled with your group.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"5\" style=\"display:grid;grid-template-columns:64px minmax(0,1fr);gap:32px;align-items:start;\"><div style=\"width:64px;height:64px;border-radius:50%;background:#111;color:#FFC83D;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;\">5<\u002Fdiv><div style=\"font-size:30px;line-height:1.4;padding-top:8px;\"><b>Name your shoot folder now.<\u002Fb> <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:27px;background:#F0F0F0;padding:2px 8px;\">FLICKER_W5_G[group]_D1<\u002Fspan> - D2 for Thursday.<\u002Fdiv><\u002Fdiv>\n    <div data-step=\"6\" data-anim=\"growx\" style=\"margin-top:auto;background:#111;color:#fff;padding:30px 36px;font-size:32px;line-height:1.35;font-weight:600;transform-origin:left center;\">Thank you for listening, <span style=\"color:#FFC83D;\">I hope you enjoy your studio session!<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n\n<sc-if value=\"{{ showFsButton }}\" hint-placeholder-val=\"{{ true }}\">\n  <button sc-camel-on-click=\"{{ toggleFs }}\" title=\"Fullscreen (F)\" style=\"position:fixed;top:18px;right:18px;z-index:2147483000;display:flex;align-items:center;gap:10px;padding:10px 16px;border:0;border-radius:999px;background:rgba(17,17,17,.82);color:#fff;font-family:'Outfit',Helvetica,sans-serif;font-size:15px;font-weight:600;cursor:pointer;\" style-hover=\"background:#111;color:#FFC83D;\">\n    <span style=\"width:14px;height:14px;border:2px solid currentColor;border-radius:2px;box-sizing:border-box;\"><\u002Fspan>\n    <span>Fullscreen<\u002Fspan>\n    <span style=\"opacity:.6;font-weight:500;\">F<\u002Fspan>\n  <\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { fs: false };\n\n  componentDidMount() {\n    this.onKey = (e) => {\n      const t = e.composedPath ? e.composedPath()[0] : e.target;\n      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;\n      if (e.metaKey || e.ctrlKey || e.altKey) return;\n      const k = e.key;\n      if (k === 'f' || k === 'F') { e.preventDefault(); e.stopImmediatePropagation(); this.toggleFs(); return; }\n      const fwd = k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ';\n      const back = k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp';\n      if (!fwd && !back) return;\n      const slide = this.active();\n      if (!slide) return;\n      if (this.cur !== slide) this.enter(slide, true);\n      const max = this.maxStep(slide), shown = slide._shown || 0;\n      if (fwd && shown < max) {\n        e.preventDefault(); e.stopImmediatePropagation();\n        slide._shown = shown + 1;\n        this.els(slide).forEach(el => { if (+el.dataset.step === shown + 1) this.reveal(el, true); });\n      } else if (back && shown > 0) {\n        e.preventDefault(); e.stopImmediatePropagation();\n        this.els(slide).forEach(el => { if (+el.dataset.step === shown) this.conceal(el, true); });\n        slide._shown = shown - 1;\n      }\n    };\n    window.addEventListener('keydown', this.onKey, true);\n    this.onChange = (e) => {\n      const d = e.detail || {};\n      if (!d.slide) return;\n      const fwd = d.previousIndex == null || d.previousIndex < 0 || d.index >= d.previousIndex;\n      this.enter(d.slide, fwd);\n    };\n    document.addEventListener('slidechange', this.onChange);\n    this.onFs = () => this.setState({ fs: !!document.fullscreenElement });\n    document.addEventListener('fullscreenchange', this.onFs);\n    this.onPrint = () => document.querySelectorAll('[data-step]').forEach(el => el.getAnimations().forEach(a => a.cancel()));\n    window.addEventListener('beforeprint', this.onPrint);\n    customElements.whenDefined('deck-stage').then(() => setTimeout(() => {\n      const s = this.active();\n      if (s && this.cur !== s) this.enter(s, true);\n    }, 60));\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('keydown', this.onKey, true);\n    document.removeEventListener('slidechange', this.onChange);\n    document.removeEventListener('fullscreenchange', this.onFs);\n    window.removeEventListener('beforeprint', this.onPrint);\n  }\n\n  active() { return document.querySelector('section[data-deck-active]'); }\n  els(slide) { return [...slide.querySelectorAll('[data-step]')]; }\n  maxStep(slide) { return this.els(slide).reduce((m, el) => Math.max(m, +el.dataset.step || 0), 0); }\n\n  hiddenKf(el) {\n    const map = {\n      left: 'translateX(-80px)', right: 'translateX(80px)', down: 'translateY(-40px)',\n      scale: 'scale(.6)', pop: 'scale(0)', growx: 'scaleX(0)', fade: 'none'\n    };\n    return { opacity: 0, transform: map[el.dataset.anim] || 'translateY(50px)' };\n  }\n\n  reveal(el, animate) {\n    el.getAnimations().forEach(a => a.cancel());\n    if (!animate) return;\n    const pop = el.dataset.anim === 'pop';\n    el.animate([this.hiddenKf(el), { opacity: 1, transform: 'none' }], {\n      duration: +(el.dataset.dur || (pop ? 650 : 800)),\n      delay: +(el.dataset.delay || 0),\n      easing: pop ? 'cubic-bezier(.34,1.56,.64,1)' : 'cubic-bezier(.2,.8,.2,1)',\n      fill: 'backwards'\n    });\n  }\n\n  conceal(el, animate) {\n    el.getAnimations().forEach(a => a.cancel());\n    el.animate([{ opacity: 1, transform: 'none' }, this.hiddenKf(el)], {\n      duration: animate ? 300 : 0, easing: 'ease-in', fill: 'forwards'\n    });\n  }\n\n  enter(slide, fwd) {\n    if (this.cur && this.cur !== slide) this.els(this.cur).forEach(el => el.getAnimations().forEach(a => a.cancel()));\n    this.cur = slide;\n    const max = this.maxStep(slide);\n    const shown = fwd ? 0 : max;\n    slide._shown = shown;\n    this.els(slide).forEach(el => {\n      const s = +el.dataset.step || 0;\n      if (s === 0) this.reveal(el, fwd);\n      else if (s <= shown) this.reveal(el, false);\n      else this.conceal(el, false);\n    });\n  }\n\n  toggleFs = () => {\n    if (document.fullscreenElement) document.exitFullscreen && document.exitFullscreen();\n    else {\n      const r = document.documentElement;\n      (r.requestFullscreen || r.webkitRequestFullscreen || (() => {})).call(r);\n    }\n  };\n\n  renderVals() {\n    return { showFsButton: !this.state.fs, toggleFs: this.toggleFs };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
